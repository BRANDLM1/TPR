enum MediaType{
  IMAGE
  VIDEO
}
enum ModalPosition {
  CENTER
  TOP_LEFT
  TOP_RIGHT
  BOTTOM_LEFT
  BOTTOM_RIGHT
}

type MediaItem {
  id: ID!
  order: Int!
  type: MediaType!
  source: String! # Media URL
  alt: String
  caption: String
}

# Central Query Object
type Story {
  id: ID!
  title: String!
  steps: [StoryStep!]!
  impactStats: [ImpactStat!]
}

type ImpactStat {
  id:ID!
  order: Int!
  title: String!
  statistic: Int!
  content: String
  mediaItems: [MediaItem!]
  link: String
}

type StoryStep {
  id: ID!
  order: Int!
  title: String!
  content: String!
  link: String
  mediaItems: [MediaItem!]
  layersToShow: [String!] # An array of Mapbox layer IDs, ex: ["ghost-bison-range"]
  layersToHide: [String!]
  dynamicPoints: [GeoJsonPointFeature!]
  dynamicPolygons: [GeoJsonPolygonFeature!]
  nextButtonText: String
  modalPosition: ModalPosition
  zoom: Float
  latitude: Float
  longitude: Float
  pitch: Float
  bearing: Float
}

type PointGeometry {
  type: String!
  coordinates: [Float!]!
}

type GeoJsonPointFeature {
  type: String!
  geometry: PointGeometry!
  properties: DynamicPointProperties!
}

type DynamicPointProperties {
  id: ID!
  name: String!
  description: String!
  color: String
  markerImage: String
  mediaItems: [MediaItem!]
  link: String
}

type PolygonGeometry {
  type: String!
  coordinates: [[[Float!]!]!]!
}

type GeoJsonPolygonFeature {
  type: String!
  geometry: PolygonGeometry!
  properties: DynamicPolygonProperties!
}

type DynamicPolygonProperties {
  id: ID!
  name: String!
  fillColor: String
  fillOpacity: Float
  lineColor: String
  lineWidth: Float
  # Dynamic point assigned to polygon
  centerPoint: GeoJsonPointFeature
}

# Fetch story query
type Query {
  story(id: String!): Story
 }
