enum MediaType{
  IMAGE
  VIDEO
}
enum ModalPosition {
  CENTER
  TOP_LEFT
  TOP_RIGHT
  BOTTOM_LEFT
  BOTTOM_RIGHT
}

type MediaItem {
  id: ID!
  order: Int!
  type: MediaType!
  source: String! # Media URL
  alt: String
  caption: String
}

# Central Query Object
type Story {
  id: ID!
  title: String!
  steps: [StoryStep!]!
  impactStats: [ImpactStat!]
}

type ImpactStat {
  id:ID!
  order: Int!
  title: String!
  statistic: Int!
  content: String
  mediaItems: [MediaItem!]
  link: String
}

type StoryStep {
  id: ID!
  order: Int!
  title: String!
  content: String!
  link: String
  mediaItems: [MediaItem!]
  layersToShow: [String!] # An array of Mapbox layer IDs, ex: ["ghost-bison-range"]
  layersToHide: [String!]
  dynamicPoints: [GeoJsonPointFeature!]
  dynamicPolygons: [GeoJsonPolygonFeature!]
  nextButtonText: String
  modalPosition: ModalPosition
  zoom: Float
  latitude: Float
  longitude: Float
  pitch: Float
  bearing: Float
}

type PointGeometry {
  type: String!
  coordinates: [Float!]!
}

type GeoJsonPointFeature {
  type: String!
  geometry: PointGeometry!
  properties: DynamicPointProperties!
}

type DynamicPointProperties {
  id: ID!
  name: String!
  description: String!
  color: String
  markerImage: String
  renderType: String!
  mediaItems: [MediaItem!]
  link: String
}

# Raw JSON pass-through. Used for polygon coordinates, whose nesting depth
# depends on the geometry type: a Polygon is [[[Float]]] (3 levels) while a
# MultiPolygon is [[[[Float]]]] (4). A fixed-depth list type can only ever
# describe one of them, and the mismatch surfaces as a hard GraphQL error
# that nulls the field and (with Apollo's default errorPolicy) discards the
# entire story response. Mapbox consumes the geometry verbatim, so passing
# it through untouched is both correct and simpler.
scalar JSON

type PolygonGeometry {
  type: String!
  coordinates: JSON!
}

type GeoJsonPolygonFeature {
  type: String!
  geometry: PolygonGeometry!
  properties: DynamicPolygonProperties!
}

type DynamicPolygonProperties {
  id: ID!
  name: String!
  fillColor: String
  fillOpacity: Float
  lineColor: String
  lineWidth: Float
  # Dynamic point assigned to polygon
  centerPoint: GeoJsonPointFeature
}

type Icon {
  name: String!
  url: String!
}

# Editable copy + URLs surfaced in the nav and landing screen. Singleton on the
# backend; clients should treat every field as authoritative and not hardcode
# fallbacks beyond a brief loading state.
type SiteSettings {
  organizationName: String!
  landingTitle: String!
  landingSubtitle: String!
  landingCtaText: String!
  donateUrl: String!
  donateLabel: String!
  contactUrl: String!
  contactLabel: String!
}

# Fetch story query
type Query {
  story(id: String!): Story
  stories: [Story!]!
  icons: [Icon!]!
  siteSettings: SiteSettings!
 }
