enum MediaType{
  IMAGE
  VIDEO
}

model MediaItem {
  id: ID!
  order: Int!
  type: MediaType!
  source: String! //Media URL
  alt: String
  caption: String
}

# Central Query Object
type Story {
  id: ID!
  title: String!
  steps: [StoryStep!]!
  dynamicStats: [ImpactStat!]!
}

type ImpactStat {
  id:ID!
  order: Int!
  title: String!
  statistic: Int!
  content: String
  mediaItems: [MediaItem!]!
  link: String
}

type StoryStep {
  id: ID!
  order: Int!
  title: String!
  content: String!
  link: String
  mediaItems: [MediaItem!]!
  layersToShow: [String!]! # An array of Mapbox layer IDs, ex: ["ghost-bison-range"]
  layersToHide: [String!]!
  dynamicPoints: [GeoJsonPointFeature]
  nextButtonText: String
  zoom: Float
  latitude: Float
  longitude: Float
  pitch: Float
  bearing: Float
}

type GeoJsonPointFeature {
  type: String!
  geometry: Point!
  properties: DynamicPointProperties!
}
type Point {
  type: String! #Always 'Point'
  coordinates: [Float!]! #[long, lat] array
}
type DynamicPointProperties {
  name: String!
  description: String!
  color: String
  markerImage: String
  mediaItems: [MediaItem!]!
}

# Fetch story query
type Query {
  story(id: String!): Story
  orderBy: { order: 'asc' }
 }
