enum MediaType{
  IMAGE
  VIDEO
}
enum ModalPosition {
  CENTER
  TOP_LEFT
  TOP_RIGHT
  BOTTOM_LEFT
  BOTTOM_RIGHT
}

model MediaItem {
  id: ID!
  order: Int!
  type: MediaType!
  source: String! //Media URL
  alt: String
  caption: String
}

# Central Query Object
type Story {
  id: ID!
  title: String!
  steps: [StoryStep!]!
  dynamicStats: [ImpactStat!]!
}

type ImpactStat {
  id:ID!
  order: Int!
  title: String!
  statistic: Int!
  content: String
  mediaItems: [MediaItem!]!
  link: String
}

type StoryStep {
  id: ID!
  order: Int!
  title: String!
  content: String!
  link: String
  mediaItems: [MediaItem!]!
  layersToShow: [String!]! # An array of Mapbox layer IDs, ex: ["ghost-bison-range"]
  layersToHide: [String!]!
  dynamicPoints: [GeoJsonPointFeature]!
  dynamicPolygons: [GeoJsonPolygonFeature]!
  nextButtonText: String
  modalPosition: ModalPosition
  zoom: Float
  latitude: Float
  longitude: Float
  pitch: Float
  bearing: Float
}

type GeoJsonPolygonFeature {
  type: String!
  geometry: PolygonGeometry!
  properties: DynamicPolygonProperties!
}
type PolygonGeometry {
  type: String! # Always "Polygon"
  # Polygon coordinate sets require nesting
  coordinates: [[[Float!]!]!]!
}
type DynamicPolygonProperties {
  id: ID!
  name: String!
  fillColor: String
  fillOpacity: Float
  lineColor: String
  lineWidth: Float
  # Dynamic point assigned to polygon
  centerPoint: GeoJsonPointFeature
}

type GeoJsonPointFeature {
  type: String!
  geometry: Point!
  properties: DynamicPointProperties!
}
type Point {
  type: String! #Always 'Point'
  coordinates: [Float!]! #[long, lat] array
}
type DynamicPointProperties {
  id: ID!
  name: String!
  description: String!
  color: String
  markerImage: String
  mediaItems: [MediaItem!]!
}

# Fetch story query
type Query {
  story(id: String!): Story
  orderBy: { order: 'asc' }
 }
