# Central Query Object
type Story {
  id: ID!
  title: String!
  steps: [StoryStep!]!
  dynamicStats: [ImpactStat!]!
}

type ImpactStat {
  id:ID!
  title: String!
  statistic: Int!
  content: String
  mediaType: String # 'image' or 'video'
  mediaSrc: String
  link: String
}

type StoryStep {
  id: ID!
  title: String!
  content: String!
  link: String
  mediaType: String
  mediaSrc: String
  layersToShow: [String!]! # An array of Mapbox layer IDs, ex: ["ghost-bison-range"]
  layersToHide: [String!]!
  dynamicPoints: [GeoJsonPointFeature]
  nextButtonText: String
  zoom: Float
  latitude: Float
  longitude: Float
  pitch: Float
  bearing: Float
}

type GeoJsonPointFeature {
  type: String!
  geometry: Point!
  properties: DynamicPointProperties!
}
type Point {
  type: String! #Always 'Point'
  coordinates: [Float!]! #[long, lat] array
}
type DynamicPointProperties {
  name: String!
  description: String!
  color: String
  markerImage: String
  mediaType: String
  mediaSrc: String
}

# Fetch story query
type Query {
  story(id: String!): Story
 }
